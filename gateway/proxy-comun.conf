# Lo mismo para todas las rutas que el gateway reenvía a un servicio.
proxy_http_version 1.1;
proxy_set_header Connection "";              # keepalive con el servicio
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $cid;
proxy_connect_timeout 1s;
proxy_read_timeout 3s;                       # objetivo de 3 s por pantalla (ADR-005)
