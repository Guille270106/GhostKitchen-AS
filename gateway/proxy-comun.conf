# Lo mismo para todas las rutas que el gateway reenvía a un servicio.
proxy_http_version 1.1;
proxy_set_header Connection "";              # keepalive con el servicio
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $cid;
proxy_connect_timeout 1s;
proxy_read_timeout 3s;                       # objetivo de 3 s por pantalla (ADR-005)

# Si una copia no contesta (conexión, timeout o 502/503/504), NGINX prueba con la otra, una sola
# vez y dentro del mismo plazo de 3 s (G17, ADR-012). Solo con lecturas: NGINX no reenvía POST ni
# PATCH a otra copia, porque repetir una escritura la podría duplicar. Con un servicio de una sola
# copia no hay a quién reintentar y no cambia nada.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 3s;
