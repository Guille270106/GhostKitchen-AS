# Headers de seguridad para todas las respuestas del gateway. Se incluye en CADA location que
# responde algo (las que reenvían a un servicio, las @ de errores, /health y los 404): en NGINX,
# si una location tiene su propio add_header (casi todas agregan X-Correlation-Id), no hereda los
# add_header del nivel server, así que ponerlos una sola vez arriba no alcanza.
#
#   - nosniff: el navegador no adivina el tipo de contenido (un JSON no se interpreta como script).
#   - DENY: ninguna página puede mostrar estas respuestas dentro de un iframe (clickjacking).
#   - no-referrer: no se manda la URL de origen a otros sitios.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
