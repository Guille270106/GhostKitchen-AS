# API Gateway de GhostKitchen (NGINX). Entrega 2: entrada de la capacidad publicada (/public/v1).
# Las rutas del frontend (/api/v1) se agregan a medida que se implementan los demás servicios.

# Módulo de OpenTelemetry (viene en la imagen nginx:*-otel): el gateway abre la traza
# de cada solicitud y la pasa a los servicios con el header traceparent.
load_module modules/ngx_otel_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # ---------- Trazas distribuidas (OpenTelemetry -> Jaeger) ----------
    otel_exporter {
        endpoint jaeger:4317;           # OTLP por gRPC
    }
    otel_service_name gateway;
    otel_trace_context propagate;       # continúa un traceparent recibido o empieza uno nuevo

    # El módulo guarda en el span la URL completa (http.target), con sus parámetros. Para no
    # mandar a Jaeger coordenadas ni textos de búsqueda, el gateway solo crea su span cuando
    # la solicitud no tiene parámetros (?...). Las demás se trazan desde Búsqueda.
    map $args $traza_gateway {
        ""      on;
        default off;
    }
    otel_trace $traza_gateway;

    # ---------- Correlation ID ----------
    # Si el consumidor manda un X-Correlation-Id válido (hasta 64 caracteres seguros) lo usamos;
    # si no, usamos el id que NGINX genera para cada solicitud.
    map $http_x_correlation_id $cid {
        "~^[A-Za-z0-9._:-]{1,64}$" $http_x_correlation_id;
        default                    $request_id;
    }

    # ---------- Logs JSON ----------
    # Ruta sin parámetros ($uri): no registramos coordenadas, cuerpos ni la API key.
    log_format json escape=json
        '{"time":"$time_iso8601","servicio":"gateway","correlation_id":"$cid","trace_id":"$otel_trace_id",'
        '"metodo":"$request_method","ruta":"$uri","estado":$status,'
        '"duracion_s":$request_time,"upstream":"$upstream_addr","bytes":$body_bytes_sent}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # ---------- Límites de la API publicada ----------
    # 60 solicitudes por minuto por API key (ADR-008). El cuerpo máximo es 64 KiB (413).
    limit_req_zone $http_x_api_key zone=api_publica:10m rate=60r/m;
    limit_req_status 429;
    limit_req_log_level notice;   # no escribir en el log de errores la URL (puede tener coordenadas)
    client_max_body_size 64k;

    upstream busqueda {
        server busqueda:8083;
        keepalive 16;
    }

    # Entrega 2: una instancia. Las 2 copias con balanceo (max_fails, fail_timeout) llegan con la caché.
    upstream catalogo {
        server catalogo:8082;
        keepalive 16;
    }

    server {
        listen 8080;

        location = /health {
            default_type application/json;
            return 200 '{"estado":"ok"}';
        }

        # ---------- Capacidad publicada: /public/v1 -> Búsqueda /v1 ----------
        location /public/v1/ {
            limit_req zone=api_publica burst=59 nodelay;
            auth_request /_auth/apikey;

            proxy_pass http://busqueda/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_set_header X-API-Key "";          # Búsqueda no necesita la clave
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;                  # plazo total de una solicitud (ADR-005)

            add_header RateLimit-Limit 60 always;

            error_page 401 = @api_key_invalida;
            error_page 413 = @demasiado_grande;
            error_page 429 = @limite_excedido;
            error_page 500 502 503 504 = @no_disponible;
        }

        # ---------- Frontend: lecturas públicas de Catálogo (/api/v1 -> Catálogo) ----------
        # Cocinas con sus restaurantes, menú de una cocina y detalle de un plato. No piden login.
        location /api/v1/cocinas {
            proxy_pass http://catalogo/cocinas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            error_page 502 503 504 = @no_disponible;
        }

        location ~ ^/api/v1/platos/([A-Za-z0-9_-]+)$ {
            proxy_pass http://catalogo/platos/$1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            error_page 502 503 504 = @no_disponible;
        }

        # Verificación de la API key: NGINX consulta a Búsqueda antes de dejar pasar la solicitud.
        location = /_auth/apikey {
            internal;
            proxy_pass http://busqueda/internal/apikey/verificar;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
        }

        # Las rutas internas de los servicios no se publican.
        location /internal/ {
            return 404;
        }

        location / {
            return 404;
        }

        # ---------- Errores en formato Problem Details (RFC 9457) ----------
        location @api_key_invalida {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            return 401 '{"type":"https://ghostkitchen.dev/errores/api-key-invalida","title":"API key inválida","status":401,"code":"API_KEY_INVALIDA","detail":"Enviá una clave válida en el header X-API-Key.","correlationId":"$cid"}';
        }

        location @demasiado_grande {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            return 413 '{"type":"https://ghostkitchen.dev/errores/solicitud-demasiado-grande","title":"Solicitud demasiado grande","status":413,"code":"SOLICITUD_DEMASIADO_GRANDE","detail":"El cuerpo JSON no puede superar 64 KiB.","correlationId":"$cid"}';
        }

        location @limite_excedido {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header Retry-After 1 always;
            add_header RateLimit-Limit 60 always;
            add_header RateLimit-Remaining 0 always;
            return 429 '{"type":"https://ghostkitchen.dev/errores/limite-excedido","title":"Límite de uso excedido","status":429,"code":"LIMITE_EXCEDIDO","detail":"Superaste 60 solicitudes por minuto. Reintentá en unos segundos.","correlationId":"$cid"}';
        }

        location @no_disponible {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header Retry-After 5 always;
            return 503 '{"type":"https://ghostkitchen.dev/errores/servicio-no-disponible","title":"Servicio no disponible","status":503,"code":"SERVICIO_NO_DISPONIBLE","detail":"El servicio no está disponible en este momento.","correlationId":"$cid"}';
        }
    }
}
