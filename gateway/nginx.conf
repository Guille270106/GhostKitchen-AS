# API Gateway de GhostKitchen (NGINX). Entradas: la capacidad publicada (/public/v1) y las rutas
# del frontend (/api/v1). Las privadas verifican el JWT con Usuarios antes de pasar (G9).

# Módulo de OpenTelemetry (viene en la imagen nginx:*-otel): el gateway abre la traza
# de cada solicitud y la pasa a los servicios con el header traceparent.
load_module modules/ngx_otel_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # ---------- Trazas distribuidas (OpenTelemetry -> Jaeger) ----------
    otel_exporter {
        endpoint jaeger:4317;           # OTLP por gRPC
    }
    otel_service_name gateway;
    otel_trace_context propagate;       # continúa un traceparent recibido o empieza uno nuevo

    # El módulo guarda en el span la URL completa (http.target), con sus parámetros. Para no
    # mandar a Jaeger coordenadas ni textos de búsqueda, el gateway solo crea su span cuando
    # la solicitud no tiene parámetros (?...). Las demás se trazan desde Búsqueda.
    map $args $traza_gateway {
        ""      on;
        default off;
    }
    otel_trace $traza_gateway;

    # ---------- Correlation ID ----------
    # Si el consumidor manda un X-Correlation-Id válido (hasta 64 caracteres seguros) lo usamos;
    # si no, usamos el id que NGINX genera para cada solicitud.
    map $http_x_correlation_id $cid {
        "~^[A-Za-z0-9._:-]{1,64}$" $http_x_correlation_id;
        default                    $request_id;
    }

    # ---------- Logs JSON ----------
    # Ruta sin parámetros ($uri): no registramos coordenadas, cuerpos ni la API key.
    log_format json escape=json
        '{"time":"$time_iso8601","servicio":"gateway","correlation_id":"$cid","trace_id":"$otel_trace_id",'
        '"metodo":"$request_method","ruta":"$uri","estado":$status,'
        '"duracion_s":$request_time,"upstream":"$upstream_addr","bytes":$body_bytes_sent}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # ---------- Límites de la API publicada ----------
    # 60 solicitudes por minuto por API key (ADR-008). El cuerpo máximo es 64 KiB (413).
    # La cuenta es por clave y no por IP: cada grupo consumidor tiene su cupo, aunque varios
    # salgan por la misma IP. 10m es la memoria compartida para llevar esa cuenta.
    limit_req_zone $http_x_api_key zone=api_publica:10m rate=60r/m;
    # NGINX no cuenta claves vacías. Sin API key, contar por IP antes de auth_request.
    # Con clave se conserva el cupo existente por consumidor.
    map $http_x_api_key $ip_sin_api_key {
        ""      $binary_remote_addr;
        default "";
    }
    limit_req_zone $ip_sin_api_key zone=api_sin_clave:10m rate=60r/m;
    # Login y registro: 10 por minuto por IP (ráfaga de 5). Frena a quien prueba contraseñas
    # una tras otra sin molestar a una persona que se equivoca un par de veces.
    limit_req_zone $binary_remote_addr zone=login_por_ip:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level notice;   # no escribir en el log de errores la URL (puede tener coordenadas)
    client_max_body_size 64k;

    # DNS interno de Docker. Sin esto, NGINX busca la dirección de cada servicio una sola vez al
    # arrancar: si después se recrea un contenedor (por ejemplo con `up --build`), cambia su IP y el
    # gateway sigue mandando a la vieja (503). Con `resolve` la vuelve a buscar cada 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Servicios a los que el gateway reenvía. keepalive deja conexiones abiertas para no
    # abrir una nueva en cada solicitud (necesita proxy_http_version 1.1 y Connection "").
    # `zone` es la memoria compartida que necesita `resolve` para guardar las direcciones.
    upstream busqueda {
        zone busqueda 64k;
        server busqueda:8083 resolve;
        keepalive 16;
    }

    upstream usuarios {
        zone usuarios 64k;
        server usuarios:8081 resolve;
        keepalive 16;
    }

    upstream inventario {
        zone inventario 64k;
        server inventario:8084 resolve;
        keepalive 16;
    }

    upstream pedidos {
        zone pedidos 64k;
        server pedidos:8085 resolve;
        keepalive 16;
    }

    # Entrega 2: una instancia. Las 2 copias con balanceo (max_fails, fail_timeout) llegan con la caché.
    upstream catalogo {
        zone catalogo 64k;
        server catalogo:8082 resolve;
        keepalive 16;
    }

    server {
        listen 8080;

        # Salud del propio gateway: responde sin consultar a ningún servicio, así solo dice
        # si NGINX está vivo.
        location = /health {
            default_type application/json;
            return 200 '{"estado":"ok"}';
        }

        # ---------- Capacidad publicada: /public/v1 -> Búsqueda /v1 ----------
        # Orden: primero el límite de uso, después la API key (auth_request) y recién ahí
        # se reenvía a Búsqueda. burst=59 + nodelay deja pasar hasta 60 seguidas sin
        # demorarlas; pasado eso responde 429 hasta que se recupere el cupo.
        # El gateway no reintenta: reintenta uno solo, el que llama a la dependencia (ADR-010).
        location /public/v1/ {
            limit_req zone=api_publica burst=59 nodelay;
            limit_req zone=api_sin_clave burst=59 nodelay;
            auth_request /_auth/apikey;

            proxy_pass http://busqueda/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_set_header X-API-Key "";          # Búsqueda no necesita la clave: no viaja ni se registra
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;                  # objetivo de 3 s por pantalla (ADR-005); cuenta entre lecturas, no es un total estricto

            add_header RateLimit-Limit 60 always;

            # Los errores que genera el propio gateway (clave inválida, límite, cuerpo grande,
            # Búsqueda caída o que no contesta) salen como Problem Details, igual que los del
            # servicio. Las respuestas de error de Búsqueda pasan tal cual (no hay
            # proxy_intercept_errors).
            error_page 401 = @api_key_invalida;
            error_page 413 = @demasiado_grande;
            error_page 429 = @limite_excedido;
            error_page 500 502 503 504 = @no_disponible;
        }

        # ---------- Frontend: lecturas públicas de Catálogo (/api/v1 -> Catálogo) ----------
        # Cocinas con sus restaurantes, menú de una cocina y detalle de un plato. No piden login.
        location /api/v1/cocinas {
            proxy_pass http://catalogo/cocinas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            error_page 502 503 504 = @no_disponible;
        }

        # Detalle de un plato. La expresión regular solo deja pasar ids con caracteres
        # seguros: cualquier otra cosa cae en "location /" y responde 404 sin llegar a Catálogo.
        location ~ ^/api/v1/platos/([A-Za-z0-9_-]+)$ {
            proxy_pass http://catalogo/platos/$1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            error_page 502 503 504 = @no_disponible;
        }

        # ---------- Frontend: cuentas (/api/v1/auth -> Usuarios) ----------
        # Registro y login no piden token. Tienen su propio límite por IP (ver login_por_ip).
        location ~ ^/api/v1/auth/(registro|login)$ {
            limit_req zone=login_por_ip burst=5 nodelay;
            proxy_pass http://usuarios/auth/$1;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 429 = @limite_excedido_login;
            error_page 502 503 504 = @no_disponible;
        }

        # ---------- Frontend: rutas privadas (verifican el JWT) ----------
        # Cada una pasa primero por /_auth/jwt. Si el token sirve, Usuarios responde 204 con la
        # identidad en headers y el gateway la copia hacia el servicio (identidad.conf). Si no,
        # 401. Si Usuarios no contesta en 300 ms, 503: falla cerrada, nunca se deja pasar sin
        # verificar.

        # Admin: crear cuentas Cocina (Usuarios además verifica el token y el rol él mismo).
        location = /api/v1/admin/cuentas-cocina {
            include /etc/nginx/identidad.conf;
            proxy_pass http://usuarios/admin/cuentas-cocina;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Admin: cocinas y restaurantes de su localidad (G11, HU14 y HU16) -> Catálogo.
        # /api/v1/admin/cocinas[/{id}[/restaurantes[/{rid}]]]. Catálogo controla que sea admin
        # y que la cocina sea de su localidad (X-Localidad).
        location ~ ^/api/v1/(admin/cocinas(?:/[A-Za-z0-9_-]+(?:/restaurantes(?:/[A-Za-z0-9_-]+)?)?)?)$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://catalogo/$1;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Cocina: sus platos (G12, HU17) -> Catálogo. GET /api/v1/cocina/platos (los suyos, activos
        # o no), PATCH /api/v1/cocina/platos/{id} y POST /api/v1/cocina/restaurantes/{rid}/platos.
        # La receta de un plato (.../platos/{id}/receta) no entra acá: va a Inventario (abajo).
        location ~ ^/api/v1/(cocina/(?:platos(?:/[A-Za-z0-9_-]+)?|restaurantes/[A-Za-z0-9_-]+/platos))$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://catalogo/$1;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Inventario de la cocina: ingredientes, recetas y la receta de un plato. Las rutas de
        # platos de Catálogo (/api/v1/cocina/platos/{id}) van a Catálogo; solo .../receta va acá.
        location ~ ^/api/v1/(cocina/ingredientes(?:/[A-Za-z0-9_-]+(?:/(?:reposiciones|mermas))?)?|cocina/recetas(?:/[A-Za-z0-9_-]+)?|cocina/platos/[A-Za-z0-9_-]+/receta)$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://inventario/$1$is_args$args;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Carrito del cliente (L6): /api/v1/carrito y /api/v1/carrito/items[/{platoId}] -> Pedidos.
        # Pedidos controla que el rol sea cliente y usa solo la identidad que pone el gateway.
        location ~ ^/api/v1/(carrito(?:/items(?:/[A-Za-z0-9_-]+)?)?)$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://pedidos/$1$is_args$args;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Pedidos (L8 y L11): POST /api/v1/pedidos confirma (con Idempotency-Key, que el gateway reenvía
        # tal cual), GET /api/v1/pedidos (mis pedidos, con ?estado= y ?pagina=), GET /api/v1/pedidos/{id},
        # POST /api/v1/pedidos/{id}/entregado y GET /api/v1/confirmaciones/{id}. Los parámetros
        # (?...) se reenvían: los valida Pedidos. El log del gateway guarda la ruta sin ellos ($uri).
        location ~ ^/api/v1/(pedidos(?:/[A-Za-z0-9_-]+(?:/entregado)?)?|confirmaciones/[A-Za-z0-9_-]+)$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://pedidos/$1$is_args$args;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Pantalla de pedidos de la cocina (L12): GET /api/v1/cocina/pedidos (con ?estado= y
        # ?pagina=) y POST /api/v1/cocina/pedidos/{id}/aceptar|rechazar|avanzar -> Pedidos.
        # Pedidos exige rol cocina y solo muestra los pedidos de su cocina (X-Cocina-Id).
        location ~ ^/api/v1/(cocina/pedidos(?:/[A-Za-z0-9_-]+/(?:aceptar|rechazar|avanzar))?)$ {
            include /etc/nginx/identidad.conf;
            proxy_pass http://pedidos/$1$is_args$args;
            include /etc/nginx/proxy-comun.conf;
            error_page 413 = @demasiado_grande;
            error_page 502 503 504 = @no_disponible;
        }

        # Verificación del JWT: subsolicitud interna a Usuarios. Solo viajan los headers (el
        # token), sin cuerpo. 300 ms y sin reintento (README del gateway). internal: no se
        # puede llamar desde afuera.
        location = /_auth/jwt {
            internal;
            proxy_pass http://usuarios/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 300ms;
            proxy_send_timeout 300ms;
            proxy_read_timeout 300ms;
        }

        # Verificación de la API key: NGINX consulta a Búsqueda antes de dejar pasar la solicitud.
        # internal: no se puede llamar desde afuera. Solo viajan los headers (sin cuerpo) y
        # tiene 1 s: si Búsqueda no contesta, la solicitud falla con 503 y no pasa (falla cerrada).
        location = /_auth/apikey {
            internal;
            proxy_pass http://busqueda/internal/apikey/verificar;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Correlation-Id $cid;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
        }

        # Las rutas internas de los servicios no se publican.
        location /internal/ {
            return 404;
        }

        # Todo lo que no se nombró arriba no existe para afuera: se publica solo lo que se
        # decidió publicar.
        location / {
            return 404;
        }

        # ---------- Errores en formato Problem Details (RFC 9457) ----------
        # Cada @error arma el mismo cuerpo que usan los servicios (type, code, correlationId),
        # así el consumidor maneja todos los errores igual, vengan del gateway o de Búsqueda.
        # "always" hace que el header salga también en respuestas de error.

        # 401: falta X-API-Key o no es válida.
        location @api_key_invalida {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            return 401 '{"type":"https://ghostkitchen.dev/errores/api-key-invalida","title":"API key inválida","status":401,"code":"API_KEY_INVALIDA","detail":"Enviá una clave válida en el header X-API-Key.","correlationId":"$cid"}';
        }

        # 401 en una ruta privada: falta el token, no sirve o venció. Mismo mensaje en los tres
        # casos, para no dar pistas.
        location @no_autenticado {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header WWW-Authenticate 'Bearer realm="ghostkitchen"' always;
            return 401 '{"type":"https://ghostkitchen.dev/errores/no-autenticado","title":"No autenticado","status":401,"code":"NO_AUTENTICADO","detail":"Iniciá sesión para continuar.","correlationId":"$cid"}';
        }

        # 429 del login: demasiados intentos desde la misma IP.
        location @limite_excedido_login {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header Retry-After 6 always;
            return 429 '{"type":"https://ghostkitchen.dev/errores/limite-excedido","title":"Demasiados intentos","status":429,"code":"LIMITE_EXCEDIDO","detail":"Hiciste muchos intentos seguidos. Esperá unos segundos y probá de nuevo.","correlationId":"$cid"}';
        }

        # 413: el cuerpo supera client_max_body_size (64 KiB).
        location @demasiado_grande {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            return 413 '{"type":"https://ghostkitchen.dev/errores/solicitud-demasiado-grande","title":"Solicitud demasiado grande","status":413,"code":"SOLICITUD_DEMASIADO_GRANDE","detail":"El cuerpo JSON no puede superar 64 KiB.","correlationId":"$cid"}';
        }

        # 429: se pasó del límite de uso. Retry-After le dice al consumidor cuándo reintentar,
        # para que no insista enseguida.
        location @limite_excedido {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header Retry-After 1 always;
            add_header RateLimit-Limit 60 always;
            add_header RateLimit-Remaining 0 always;
            return 429 '{"type":"https://ghostkitchen.dev/errores/limite-excedido","title":"Límite de uso excedido","status":429,"code":"LIMITE_EXCEDIDO","detail":"Superaste 60 solicitudes por minuto. Reintentá en unos segundos.","correlationId":"$cid"}';
        }

        # 503: el servicio está caído, no contesta a tiempo o falló la verificación de la clave.
        # Se responde rápido y con honestidad en lugar de dejar la conexión colgada (ADR-010).
        location @no_disponible {
            default_type application/problem+json;
            add_header X-Correlation-Id $cid always;
            add_header Retry-After 5 always;
            return 503 '{"type":"https://ghostkitchen.dev/errores/servicio-no-disponible","title":"Servicio no disponible","status":503,"code":"SERVICIO_NO_DISPONIBLE","detail":"El servicio no está disponible en este momento.","correlationId":"$cid"}';
        }
    }
}
