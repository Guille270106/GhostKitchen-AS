# Verificación del JWT para una ruta privada. Se incluye adentro de cada location privada.
#
# 1. auth_request le pregunta a Usuarios (/_auth/jwt) si el token sirve.
# 2. auth_request_set guarda la identidad que devuelve Usuarios en headers.
# 3. proxy_set_header la manda al servicio de destino. Siempre se pisan los cuatro headers:
#    si el cliente mandó un X-Rol: admin inventado, se reemplaza por el verdadero, o se borra
#    (proxy_set_header con valor vacío no envía el header).
auth_request /_auth/jwt;
auth_request_set $usuario_id     $upstream_http_x_usuario_id;
auth_request_set $usuario_email  $upstream_http_x_usuario_email;
auth_request_set $usuario_rol    $upstream_http_x_rol;
auth_request_set $usuario_cocina $upstream_http_x_cocina_id;
auth_request_set $usuario_localidad $upstream_http_x_localidad;
proxy_set_header X-Usuario-Id    $usuario_id;
proxy_set_header X-Usuario-Email $usuario_email;
proxy_set_header X-Rol           $usuario_rol;
proxy_set_header X-Cocina-Id     $usuario_cocina;
proxy_set_header X-Localidad     $usuario_localidad;

# 401 de Usuarios: token que falta, vencido o mal firmado. 500: Usuarios no contestó a tiempo
# o está caído (NGINX convierte cualquier falla de la subsolicitud en 500): se responde 503,
# y la solicitud no pasa.
error_page 401 = @no_autenticado;
error_page 500 = @no_disponible;
