# NGINX del frontend: sirve el build de producción (dist/) y le pasa /api al gateway, igual que
# hacía el proxy de Vite. Así el navegador ve un solo origen y no hacen falta reglas de CORS.
server {
    listen 5173;
    server_tokens off;
    root /usr/share/nginx/html;

    # Comprime lo que más pesa: el código, los estilos y las respuestas JSON de la API.
    gzip on;
    gzip_types application/javascript text/css application/json application/problem+json image/svg+xml;
    gzip_min_length 1024;

    # La API va al gateway. El nombre se resuelve en cada solicitud (DNS de Docker): si el
    # gateway se recrea con otra IP, el frontend lo sigue encontrando sin reiniciarse.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Los archivos de Vite llevan un hash en el nombre (index-<hash>.js): si cambian, cambia el
    # nombre. Por eso se pueden guardar en caché un año sin riesgo de servir uno viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html no se guarda en caché: es el que dice qué archivos nuevos cargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Las rutas de la aplicación (/cocina/inventario, /pedidos...) no son archivos: las resuelve
    # React. Si no existe el archivo, se sirve index.html, así recargar con F5 en una página
    # interna funciona, y una ruta que no existe muestra la página de "no encontrado" de React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
