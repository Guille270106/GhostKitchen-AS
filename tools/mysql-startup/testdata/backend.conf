events {}
http {
    server {
        listen 8083;
        location = /internal/apikey/verificar {
            if ($http_x_api_key != "test-key") { return 401; }
            return 204;
        }
        location / { return 200 '{"estado":"ok"}'; }
    }
    server {
        listen 8082;
        location / { return 200 '{"estado":"ok"}'; }
    }
}
